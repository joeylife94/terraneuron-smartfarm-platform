services:
  mosquitto:
    command: ["mosquitto", "-c", "/mosquitto/config/d3.conf"]
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/d3/mosquitto.conf:/mosquitto/config/d3.conf:ro
      - ./infra/mosquitto/d3/acl:/mosquitto/config/d3-auth/acl:ro
      - ./.d3-runtime/passwords:/mosquitto/config/d3-auth/passwords:ro
      - ./.d3-runtime/certs:/mosquitto/config/d3-certs:ro

  terra-sense:
    environment:
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_CLIENT_ID: terra-sense-bridge
      MQTT_USERNAME: terra-sense-bridge
      MQTT_PASSWORD: ${D3_BRIDGE_PASSWORD:-d3-bridge-demo-only}
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/d3/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./.d3-runtime/truststore.p12:/d3/truststore.p12:ro
