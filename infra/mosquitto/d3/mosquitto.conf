# D3 proof-only authenticated + encrypted MQTT profile.
# Synthetic/local/CI evidence only; not a production PKI or provisioning design.

listener 8883
protocol mqtt
allow_anonymous false

cafile /mosquitto/config/d3-certs/ca.crt
certfile /mosquitto/config/d3-certs/server.crt
keyfile /mosquitto/config/d3-certs/server.key
require_certificate false

password_file /mosquitto/config/d3-auth/passwords
acl_file /mosquitto/config/d3-auth/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
