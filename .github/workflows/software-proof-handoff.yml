name: Software Proof Handoff

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff-smoke:
    name: Reproduce Bounded Software Proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: DEMO_ONLY_E2E_CI_JWT_SECRET_32_CHARS_MIN
      E2E_POLL_TIMEOUT_SECONDS: '90'
      E2E_POLL_INTERVAL_SECONDS: '2'

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install handoff dependency
        run: pip install requests

      - name: Validate handoff script syntax
        run: bash -n tests/software-proof-handoff.sh

      - name: Execute bounded software Proof handoff
        shell: bash
        run: |
          set -o pipefail
          bash tests/software-proof-handoff.sh 2>&1 | tee software-proof-handoff.log

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps --all > software-proof-compose-ps.txt 2>&1 || true
          docker compose logs --no-color > software-proof-compose.log 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-proof-handoff-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            software-proof-handoff.log
            software-proof-compose-ps.txt
            software-proof-compose.log
