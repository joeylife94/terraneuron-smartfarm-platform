name: D4 Device Integration Conformance Pilot

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  d4-device-integration-conformance:
    name: Synthetic Adapter Integration Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: DEMO_ONLY_D4_CI_JWT_SECRET_32_CHARS_MIN
      E2E_POLL_TIMEOUT_SECONDS: '90'
      E2E_POLL_INTERVAL_SECONDS: '1'
      D3_BRIDGE_PASSWORD: d4-ci-bridge-password
      D3_DEVICE_A_PASSWORD: d4-ci-device-a-password
      D3_DEVICE_B_PASSWORD: d4-ci-device-b-password

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Validate D4 proof syntax and compose boundary
        run: |
          python -m py_compile tests/command-lifecycle-test.py
          python -m py_compile tests/synthetic-mqtt-device.py
          python -m py_compile tests/synthetic-farm-operations-pilot.py
          python -m py_compile tests/d3-authenticated-device-messaging.py
          python -m py_compile tests/d4-device-integration-conformance.py
          bash -n tests/d3-authenticated-device-messaging.sh
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.d3.yml config --quiet

      - name: Install proof dependency
        run: pip install requests

      - name: Execute bounded synthetic adapter capability contract
        working-directory: services/terra-sense
        run: >-
          gradle test --no-daemon --stacktrace
          --tests com.terraneuron.sense.service.SyntheticConformanceDeviceCapabilityResolverTest

      - name: Start accepted D3 authenticated boundary and verify regression
        shell: bash
        run: |
          set -o pipefail
          TERRANEURON_D3_KEEP_STACK=1 bash tests/d3-authenticated-device-messaging.sh 2>&1 | tee d4-d3-boundary-output.log

      - name: Execute adapter/model through authenticated MQTT integration path
        shell: bash
        run: |
          set -o pipefail
          python3 tests/d4-device-integration-conformance.py 2>&1 | tee d4-device-integration-conformance-output.log

      - name: Capture diagnostics without runtime credentials
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.d3.yml ps --all > d4-compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.d3.yml logs --no-color > d4-compose.log 2>&1 || true
          rm -rf .d3-runtime

      - name: Upload bounded conformance evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-device-integration-conformance-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/d4-device-integration-conformance.json
            artifacts/d3-authenticated-device-messaging.json
            d4-device-integration-conformance-output.log
            d4-d3-boundary-output.log
            d4-compose-ps.txt
            d4-compose.log
            services/terra-sense/build/test-results/test/
            services/terra-sense/build/reports/tests/test/

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.d3.yml down -v || true
          rm -rf .d3-runtime
