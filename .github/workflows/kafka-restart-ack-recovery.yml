name: Kafka Restart ACK Recovery Proof

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  kafka-restart-ack-recovery:
    name: Synthetic Kafka Restart ACK Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: DEMO_ONLY_E2E_CI_JWT_SECRET_32_CHARS_MIN
      E2E_POLL_TIMEOUT_SECONDS: '120'
      E2E_POLL_INTERVAL_SECONDS: '1'
      E2E_ACK_TIMEOUT_SECONDS: '30'
      E2E_ACK_TIMEOUT_SCAN_MS: '1000'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kafka recovery test syntax
        run: |
          python -m py_compile tests/command-lifecycle-test.py
          python -m py_compile tests/kafka-restart-ack-recovery-test.py

      - name: Validate Docker Compose recovery configuration
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml config --quiet

      - name: Start recovery infrastructure
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml up -d \
            zookeeper kafka mysql influxdb mosquitto redis

      - name: Wait for MySQL readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml \
              exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "mysql is ready"
              exit 0
            fi
            sleep 2
          done
          echo "mysql did not become ready"
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml logs --tail=100 mysql
          exit 1

      - name: Wait for Kafka readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml \
              exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list > /dev/null; then
              echo "kafka is ready"
              exit 0
            fi
            sleep 2
          done
          echo "kafka did not become ready"
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml logs --tail=100 kafka
          exit 1

      - name: Start recovery application services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml up -d \
            terra-sense terra-ops

      - name: Wait for services
        shell: bash
        run: |
          wait_for_service() {
            local service="$1"
            local url="$2"
            echo "Waiting for ${service} at ${url}"
            for attempt in {1..60}; do
              if curl --fail --silent --show-error --max-time 5 "${url}" > /dev/null; then
                echo "${service} is ready"
                return 0
              fi
              sleep 5
            done
            echo "${service} did not become ready"
            docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml logs --tail=100 "${service}"
            return 1
          }
          wait_for_service terra-sense http://localhost:8081/actuator/health
          wait_for_service terra-ops http://localhost:8080/actuator/health

      - name: Install test dependency
        run: pip install requests

      - name: Run Kafka restart ACK recovery proof
        shell: bash
        run: |
          set -o pipefail
          python tests/kafka-restart-ack-recovery-test.py 2>&1 | tee kafka-restart-ack-recovery-output.log

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml ps --all > kafka-restart-compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml logs --no-color > kafka-restart-compose.log 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-restart-ack-recovery-diagnostics
          if-no-files-found: error
          retention-days: 7
          path: |
            kafka-restart-ack-recovery-output.log
            kafka-restart-compose-ps.txt
            kafka-restart-compose.log

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e-recovery.yml down -v
